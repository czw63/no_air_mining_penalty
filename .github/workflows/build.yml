name: Build and Release

on:
  push:
    branches: [ main, work ]
    tags:
      - 'v*'               # 当推送 v1.0.0, v1.0.1 等标签时触发
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Fabric module
        run: ./gradlew :fabric:build --no-daemon

      - name: Build NeoForge module
        run: ./gradlew :neoforge:build --no-daemon

      - name: Rename Fabric jar
        run: |
          mkdir -p artifacts
          # 查找构建出的 jar 文件（通常只有一个）
          FABRIC_JAR=$(ls fabric/build/libs/*.jar | grep -v sources | grep -v shadow | head -n 1)
          cp "$FABRIC_JAR" "artifacts/no_air_mining_penalty-fabric-universal.jar"

      - name: Rename NeoForge jar
        run: |
          NEOFORGE_JAR=$(ls neoforge/build/libs/*.jar | grep -v sources | grep -v shadow | head -n 1)
          cp "$NEOFORGE_JAR" "artifacts/no_air_mining_penalty-neoforge-universal.jar"

      - name: Upload artifacts (for CI)
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: artifacts/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: mod-jars
          path: artifacts

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.jar
          generate_release_notes: true
