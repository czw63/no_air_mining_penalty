name: Build and Release

on:
  push:
    tags:
      - 'v*'               # 推送 v1.0.0, v1.0.1 等标签时触发
  workflow_dispatch:       # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Fabric module
        run: ./gradlew :fabric:build --no-daemon

      - name: Build NeoForge module
        run: ./gradlew :neoforge:build --no-daemon

      - name: List generated JAR files
        run: |
          echo "Fabric JARs:"
          ls -l fabric/build/libs/
          echo "NeoForge JARs:"
          ls -l neoforge/build/libs/

      - name: Create GitHub Release and upload JARs
        uses: softprops/action-gh-release@v1
        with:
          files: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}